name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Capacitor CLI & prepare project
      run: |
        npm init -y
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest
        mkdir -p www
        if [ -f "index.html" ]; then cp index.html www/; fi
        npx cap init Mirror com.mirror.messenger --web-dir www
        npx cap add ios

    - name: Build iOS project (Xcode)
      run: |
        cd ios
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive
        
