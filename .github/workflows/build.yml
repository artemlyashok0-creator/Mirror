name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Capacitor CLI & prepare project
      run: |
        npm init -y
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
        
        mkdir -p www
        if [ -f "index.html" ]; then mv index.html www/; fi
        
        npx cap init Mirror com.mirror.messenger --web-dir www
        npx cap add android

    - name: Allow HTTP Cleartext Traffic in Android
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          echo "Successfully added usesCleartextTraffic to AndroidManifest.xml"
        else
          echo "Manifest not found!"
          exit 1
        fi

    - name: Build Android APK Debug
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mirror-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
