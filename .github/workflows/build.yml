name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Capacitor CLI & prepare project
      run: |
        npm init -y
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
        
        mkdir -p www
        if [ -f "index.html" ]; then mv index.html www/; fi
        
        npx cap init Mirror com.mirror.messenger --web-dir www
        npx cap add android

    - name: Fix Gradle Build Config & Build APK
      run: |
        cd android
        chmod +x gradlew
        # Додаємо примусове оновлення конфігурації без старих кешів
        ./gradlew assembleDebug --refresh-dependencies

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mirror-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
