name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Capacitor CLI & prepare project
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        
        # Створюємо папку www, якщо її немає
        mkdir -p www
        
        # Якщо index.html лежить у корені репозиторію, переносимо його в www
        if [ -f "index.html" ]; then mv index.html www/; fi
        
        # Ініціалізуємо Capacitor
        npx cap init Mirror com.mirror.messenger --web-dir www
        
        # Додаємо платформу Android та синхронізуємо (створює всі потрібні gradle-файли)
        npx cap add android
        npx cap sync android

    - name: Build Android APK Debug
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean
        ./gradlew assembleDebug --no-daemon
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mirror-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
