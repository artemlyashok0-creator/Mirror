<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror Messenger</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0e1621; color: #f5f5f5; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Екрани */
        .screen { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; top: 0; left: 0; background-color: #0e1621; }
        .screen.active { display: flex; }

        /* Авторизація */
        #auth-screen { justify-content: center; align-items: center; padding: 20px; }
        .auth-card { width: 100%; max-width: 320px; text-align: center; }
        .auth-card h1 { color: #5288c1; margin-bottom: 8px; font-size: 28px; }
        .auth-card p { color: #8899a6; margin-bottom: 24px; font-size: 14px; }
        input, button { width: 100%; padding: 12px 16px; border-radius: 12px; border: none; font-size: 15px; outline: none; margin-bottom: 12px; }
        input { background-color: #17212b; color: #fff; border: 1px solid #232e3c; }
        input:focus { border-color: #5288c1; }
        button { background-color: #5288c1; color: #fff; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:active { background-color: #406f9e; }
        .error { color: #ff5959; font-size: 13px; margin-top: 8px; }
        .success { color: #51cf66; font-size: 13px; margin-top: 8px; }

        /* Головний інтерфейс (Telegram-стиль) */
        .app-header { background-color: #17212b; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #0e1621; }
        .app-header h2 { font-size: 18px; color: #fff; }
        
        .search-box { padding: 8px 12px; background-color: #0e1621; }
        .search-box input { margin-bottom: 0; border-radius: 20px; padding: 8px 16px; background-color: #17212b; font-size: 14px; }

        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid #17212b; cursor: pointer; transition: background 0.1s; }
        .chat-item:active { background-color: #1c2938; }
        .chat-avatar { width: 50px; height: 50px; border-radius: 50%; background-color: #5288c1; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: #fff; margin-right: 12px; flex-shrink: 0; }
        .chat-info { flex: 1; min-width: 0; }
        .chat-title-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .chat-name { font-weight: 600; font-size: 15px; color: #fff; }
        .chat-time { font-size: 12px; color: #8899a6; }
        .chat-preview { font-size: 13px; color: #8899a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Нижня панель навігації */
        .nav-bar { display: flex; background-color: #17212b; border-top: 1px solid #0e1621; height: 56px; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8899a6; font-size: 11px; cursor: pointer; text-decoration: none; transition: color 0.2s; }
        .nav-item.active { color: #5288c1; }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }

        /* Екран самого чату */
        #chat-room-screen { background-color: #0e1621; }
        .room-header { background-color: #17212b; padding: 10px 16px; display: flex; align-items: center; border-bottom: 1px solid #0e1621; }
        .back-btn { background: none; border: none; color: #5288c1; font-size: 16px; width: auto; padding: 0; margin-right: 16px; cursor: pointer; }
        .room-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .message-bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .message-bubble.incoming { background-color: #182533; align-self: flex-start; border-bottom-left-radius: 4px; }
        .message-bubble.outgoing { background-color: #2b5278; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-sender { font-size: 11px; color: #5288c1; margin-bottom: 2px; font-weight: 600; }
        
        .room-input-area { padding: 10px 12px; background-color: #17212b; display: flex; align-items: center; gap: 8px; }
        .room-input-area input { margin-bottom: 0; border-radius: 20px; background-color: #0e1621; }
        .send-btn { width: 44px; height: 44px; border-radius: 50%; background-color: #5288c1; display: flex; align-items: center; justify-content: center; margin-bottom: 0; padding: 0; flex-shrink: 0; }
        
        /* Заглушки для інших вкладок */
        .placeholder-screen { padding: 24px; text-align: center; color: #8899a6; font-size: 15px; margin-top: 40px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 1. ЕКРАН АВТОРИЗАЦІЇ -->
    <div id="auth-screen" class="screen active">
        <div class="auth-card">
            <h1>Mirror</h1>
            <p>Офлайн кишеньковий дата-центр</p>
            <input type="text" id="username" placeholder="Введіть ваше ім'я..." autocomplete="off">
            <button onclick="registerUser()">Зареєструватися</button>
            <button onclick="loginUser()" style="background-color: #17212b; color: #5288c1; border: 1px solid #5288c1;">Увійти в систему</button>
            <div id="message-container"></div>
        </div>
    </div>

    <!-- 2. ГОЛОВНИЙ ЕКРАН З ВКЛАДКАМИ -->
    <div id="main-screen" class="screen">
        <div class="app-header">
            <h2 id="app-title">Чати</h2>
            <span style="font-size: 18px; cursor: pointer; color: #8899a6;" onclick="logout()">⚙️</span>
        </div>

        <!-- Вкладка: ЧАТИ -->
        <div id="tab-chats" class="screen active" style="position: relative; height: calc(100% - 113px);">
            <div class="search-box">
                <input type="text" placeholder="Пошук чатів...">
            </div>
            <div class="chat-list" id="chats-container">
                <!-- Динамічний список чатів генерується скриптом -->
                <div class="chat-item" onclick="openChat('default', 'Глобальний чат')">
                    <div class="chat-avatar">Г</div>
                    <div class="chat-info">
                        <div class="chat-title-row">
                            <span class="chat-name">Глобальний чат</span>
                            <span class="chat-time">22:00</span>
                        </div>
                        <div class="chat-preview">Натисніть, щоб відкрити офлайн-бесіду...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Вкладка: КОНТАКТИ -->
        <div id="tab-contacts" class="screen placeholder-screen" style="position: relative; height: calc(100% - 113px);">
            <p>Контакти зберігаються локально у вашій базі даних SQLite.</p>
        </div>

        <!-- Вкладка: НАЛАШТУВАННЯ -->
        <div id="tab-settings" class="screen placeholder-screen" style="position: relative; height: calc(100% - 113px);">
            <p>Сервер Termux працює на порту 8000.</p>
            <p style="margin-top: 10px; color: #5288c1;">Статус: Підключено</p>
        </div>

        <!-- Нижня панель навігації Telegram-стилю -->
        <div class="nav-bar">
            <div class="nav-item active" onclick="switchTab('chats', this)">
                <span class="nav-icon">💬</span>
                <span>Чати</span>
            </div>
            <div class="nav-item" onclick="switchTab('contacts', this)">
                <span class="nav-icon">👥</span>
                <span>Контакти</span>
            </div>
            <div class="nav-item" onclick="switchTab('settings', this)">
                <span class="nav-icon">⚙️</span>
                <span>Налаштування</span>
            </div>
        </div>
    </div>

    <!-- 3. ЕКРАН ОКРЕМОГО ЧАТУ -->
    <div id="chat-room-screen" class="screen">
        <div class="room-header">
            <button class="back-btn" onclick="closeChat()">❮ Назад</button>
            <h2 id="room-title" style="font-size: 16px; color: #fff;">Чат</h2>
        </div>
        <div class="room-messages" id="room-messages-box">
            <!-- Повідомлення чату -->
        </div>
        <div class="room-input-area">
            <input type="text" id="room-msg-input" placeholder="Повідомлення..." autocomplete="off">
            <button class="send-btn" onclick="sendRoomMessage()">➤</button>
        </div>
    </div>

    <script>
        const SERVER_URL = "http://127.0.0.1:8000";
        let activeChatId = 'default';

        function showMessage(text, isError = true) {
            const container = document.getElementById('message-container');
            container.innerHTML = `<div class="${isError ? 'error' : 'success'}">${text}</div>`;
        }

        async function registerUser() {
            const username = document.getElementById('username').value.trim();
            if (!username) { showMessage("Введіть ім'я!"); return; }
            try {
                const res = await fetch(`${SERVER_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                if (res.ok) showMessage("Реєстрація успішна! Увійдіть.", false);
                else showMessage("Користувач уже існує.");
            } catch (e) { showMessage("Помилка зв'язку з Termux!"); }
        }

        async function loginUser() {
            const username = document.getElementById('username').value.trim();
            if (!username) { showMessage("Введіть ім'я для входу!"); return; }
            try {
                const res = await fetch(`${SERVER_URL}/status`);
                if (res.ok) {
                    localStorage.setItem('mirror_user', username);
                    enterMainApp();
                } else { showMessage("Сервер недоступний."); }
            } catch (e) { showMessage("Немає зв'язку з бекендом."); }
        }

        function enterMainApp() {
            document.getElementById('auth-screen').classList.remove('active');
            document.getElementById('main-screen').classList.add('active');
            startPolling();
        }

        function logout() {
            localStorage.removeItem('mirror_user');
            document.getElementById('main-screen').classList.remove('active');
            document.getElementById('auth-screen').classList.add('active');
        }

        // Перемикання вкладок нижньої панелі
        function switchTab(tabName, element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('tab-chats').classList.add('hidden');
            document.getElementById('tab-contacts').classList.add('hidden');
            document.getElementById('tab-settings').classList.add('hidden');

            if (tabName === 'chats') {
                document.getElementById('tab-chats').classList.remove('hidden');
                document.getElementById('app-title').innerText = "Чати";
            } else if (tabName === 'contacts') {
                document.getElementById('tab-contacts').classList.remove('hidden');
                document.getElementById('app-title').innerText = "Контакти";
            } else if (tabName === 'settings') {
                document.getElementById('tab-settings').classList.remove('hidden');
                document.getElementById('app-title').innerText = "Налаштування";
            }
        }

        // Відкрити конкретний чат
        async function openChat(chatId, chatName) {
            activeChatId = chatId;
            document.getElementById('room-title').innerText = chatName;
            document.getElementById('main-screen').classList.remove('active');
            document.getElementById('chat-room-screen').classList.add('active');
            await loadRoomMessages();
        }

        function closeChat() {
            document.getElementById('chat-room-screen').classList.remove('active');
            document.getElementById('main-screen').classList.add('active');
        }

        async function loadRoomMessages() {
            try {
                const res = await fetch(`${SERVER_URL}/data`);
                if (res.ok) {
                    const data = await res.json();
                    const box = document.getElementById('room-messages-box');
                    box.innerHTML = '';
                    
                    const messages = data.messages[activeChatId] || [];
                    const currentUser = localStorage.getItem('mirror_user');

                    if (messages.length === 0) {
                        box.innerHTML = `<div style="text-align:center; color:#8899a6; margin-top:20px;">Повідомлень немає</div>`;
                    } else {
                        messages.forEach(msg => {
                            const isOutgoing = msg.sender === currentUser;
                            box.innerHTML += `
                                <div class="message-bubble ${isOutgoing ? 'outgoing' : 'incoming'}">
                                    ${!isOutgoing ? `<div class="msg-sender">${msg.sender}</div>` : ''}
                                    <div>${msg.text}</div>
                                </div>`;
                        });
                        box.scrollTop = box.scrollHeight;
                    }
                }
            } catch (e) { console.error(e); }
        }

        async function sendRoomMessage() {
            const input = document.getElementById('room-msg-input');
            const text = input.value.trim();
            const sender = localStorage.getItem('mirror_user') || 'Гість';
            if (!text) return;

            try {
                await fetch(`${SERVER_URL}/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatId: activeChatId, sender, text })
                });
                input.value = '';
                await loadRoomMessages();
            } catch (e) { alert("Помилка надсилання"); }
        }

        function startPolling() {
            setInterval(() => {
                if (document.getElementById('chat-room-screen').classList.contains('active')) {
                    loadRoomMessages();
                }
            }, 3000);
        }

        window.onload = () => {
            if (localStorage.getItem('mirror_user')) {
                enterMainApp();
            }
        }
    </script>
</body>
                                </html>
