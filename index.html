<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror Messenger</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 100%; max-width: 380px; padding: 24px; background: #1e293b; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        h1 { margin-bottom: 8px; font-size: 26px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        input { width: 100%; padding: 12px 16px; margin-bottom: 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 16px; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-bottom: 10px; }
        .btn-primary { background: #38bdf8; color: #0f172a; }
        .btn-primary:hover { background: #0ea5e9; }
        .btn-secondary { background: transparent; color: #94a3b8; border: 1px solid #334155; }
        .btn-secondary:hover { color: #fff; border-color: #64748b; }
        .hidden { display: none; }
        .error { color: #f43f5e; font-size: 13px; margin-bottom: 15px; }
        .success { color: #10b981; font-size: 13px; margin-bottom: 15px; }
        .chat-box { text-align: left; height: 300px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        .msg { margin-bottom: 8px; font-size: 14px; }
        .msg span { font-weight: bold; color: #38bdf8; }
    </style>
</head>
<body>

    <div class="container" id="auth-screen">
        <h1>Mirror</h1>
        <p>Офлайн кишеньковий дата-центр</p>
        
        <div id="message-container"></div>

        <input type="text" id="username" placeholder="Введіть ваше ім'я (username)" autocomplete="off">
        
        <button class="btn-primary" onclick="registerUser()">Зареєструватися</button>
        <button class="btn-secondary" onclick="loginUser()">Увійти в систему</button>
    </div>

    <div class="container hidden" id="chat-screen">
        <h1 id="welcome-title">Чат</h1>
        <p>Підключено до локального серверу</p>
        
        <div class="chat-box" id="chat-messages">
            <div class="msg"><span>Система:</span> З'єднання встановлено.</div>
        </div>

        <input type="text" id="msg-input" placeholder="Введіть повідомлення..." autocomplete="off">
        <button class="btn-primary" onclick="sendMessage()">Надіслати</button>
        <button class="btn-secondary" onclick="logout()" style="margin-top: 5px;">Вийти</button>
    </div>

    <script>
        // Використовуємо 101.0.0.1 або 127.0.0.1 для локального бекенду в Termux
        const SERVER_URL = "http://127.0.0.1:8000";

        function showMessage(text, isError = true) {
            const container = document.getElementById('message-container');
            container.innerHTML = `<div class="${isError ? 'error' : 'success'}">${text}</div>`;
        }

        async function registerUser() {
            const username = document.getElementById('username').value.trim();
            if (!username) {
                showMessage("Будь ласка, введіть ім'я!");
                return;
            }

            try {
                const response = await fetch(`${SERVER_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });

                if (response.ok) {
                    showMessage("Реєстрація успішна! Тепер увійдіть.", false);
                } else {
                    showMessage("Користувач уже існує або помилка сервера.");
                }
            } catch (err) {
                showMessage("Помилка з'єднання з сервером у Termux!");
            }
        }

        async function loginUser() {
            const username = document.getElementById('username').value.trim();
            if (!username) {
                showMessage("Будь ласка, введіть ім'я для входу!");
                return;
            }

            try {
                // Перевіряємо статус або робимо спробу входу
                const response = await fetch(`${SERVER_URL}/status`);
                if (response.ok) {
                    // Зберігаємо ім'я та переходимо в чат
                    localStorage.setItem('mirror_user', username);
                    enterChat(username);
                } else {
                    showMessage("Сервер недоступний.");
                }
            } catch (err) {
                showMessage("Не вдалося достукатися до бекенду. Перевірте, чи запущений Python у Termux!");
            }
        }

        function enterChat(username) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('welcome-title').innerText = `Привіт, ${username}`;
            loadMessages();
        }

        function logout() {
            localStorage.removeItem('mirror_user');
            document.getElementById('chat-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }

        async function loadMessages() {
            try {
                const res = await fetch(`${SERVER_URL}/data`);
                if (res.ok) {
                    const data = await res.json();
                    const box = document.getElementById('chat-messages');
                    box.innerHTML = '';
                    // Тут виводимо повідомлення з бази
                    box.innerHTML += `<div class="msg"><span>Сервер:</span> База даних активна.</div>`;
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function sendMessage() {
            const textInput = document.getElementById('msg-input');
            const text = textInput.value.trim();
            const username = localStorage.getItem('mirror_user') || 'Гість';

            if (!text) return;

            try {
                await fetch(`${SERVER_URL}/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatId: 'default', sender: username, text: text })
                });
                textInput.value = '';
                loadMessages();
            } catch (e) {
                alert("Помилка надсилання повідомлення");
            }
        }

        // Автоматичний вхід, якщо користувач вже авторизований на цьому пристрої
        window.onload = () => {
            const savedUser = localStorage.getItem('mirror_user');
            if (savedUser) {
                enterChat(savedUser);
            }
        }
    </script>
</body>
</html>
